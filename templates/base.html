<!DOCTYPE html>
<html lang="uk" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна робота 1 | Криптографія</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; }
        .cyber-card { background-color: #1e1e1e; border: 1px solid #0d6efd; box-shadow: 0 0 15px rgba(13,110,253,0.2); }
        .brand-text { color: #0d6efd; font-weight: bold; letter-spacing: 1px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark border-bottom border-primary">
        <div class="container">
            <span class="navbar-brand brand-text">🔒 CryptoLab v1.0</span>
            {% if session.get('username') %}
                <span class="navbar-text">
                    Користувач: {{ session.username }} | <a href="/logout" class="text-danger text-decoration-none">Вихід</a>
                </span>
            {% endif %}
        </div>
    </nav>
    <div class="container mt-5">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
